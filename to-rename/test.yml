name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.1']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python libraries
        # lxml is the converter's one dependency; python-docx only makes test files
        run: pip install lxml python-docx
      - run: make deps
      - run: make check
